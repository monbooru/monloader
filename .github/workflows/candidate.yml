name: Candidate

concurrency:
  group: candidate
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      binaries:
        description: Build the binaries, installers, AppImage and Flatpak, and publish them as the dev-build pre-release
        type: boolean
        default: true
      docker:
        description: Build the images and push them as :dev and :dev-<sha>
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  check:
    name: On dev
    runs-on: ubuntu-latest
    permissions:
      checks: read
    outputs:
      short: ${{ steps.sha.outputs.SHORT }}
    steps:
      - name: On dev
        run: |
          if [ "${{ github.ref }}" != refs/heads/dev ]; then
            echo "::error::Candidate runs on dev, not on ${{ github.ref_name }}."
            exit 1
          fi

      - name: Verify is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=verify&filter=all&per_page=100" --jq '.check_runs | max_by(.id) | if . == null then "" else (.conclusion // .status) end')"
          if [ -z "$newest" ]; then
            echo "::error::Verify has not run on $GITHUB_SHA; wait for it, or run it by hand first."
            exit 1
          fi
          if [ "$newest" != success ]; then
            echo "::error::Verify's newest run on $GITHUB_SHA is not green: $newest"
            exit 1
          fi

      - name: Short sha
        id: sha
        run: echo "SHORT=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

  images:
    if: inputs.docker
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      image_tags: dev dev-${{ needs.check.outputs.short }}
      binaries: false
    secrets: inherit

  binaries:
    if: inputs.binaries
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      docker: false
    secrets: inherit

  prerelease:
    name: The dev-build pre-release
    if: inputs.binaries
    runs-on: ubuntu-latest
    needs: [check, binaries]
    permissions:
      contents: write
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Checksum every artifact
        working-directory: dist
        run: sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .

      - name: Replace the dev-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHORT: ${{ needs.check.outputs.short }}
        run: |
          title="dev-build $SHORT"
          notes="Built on demand from dev at $GITHUB_SHA on $(date -u +%Y-%m-%d). Not a release: it is replaced by the next candidate and carries no support."
          if gh release view dev-build > /dev/null 2>&1; then
            gh release upload dev-build dist/* --clobber
            gh release view dev-build --json assets --jq '.assets[].name' | while read -r name; do
              [ -e "dist/$name" ] || gh release delete-asset dev-build "$name" --yes
            done
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/dev-build" -f sha="$GITHUB_SHA" -F force=true > /dev/null \
              || gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/dev-build -f sha="$GITHUB_SHA" > /dev/null
            gh release edit dev-build --prerelease --title "$title" --notes "$notes"
          else
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/dev-build" 2>/dev/null || true
            gh release create dev-build --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes" dist/*
          fi
