name: Release

# Builds the Docker image for amd64 and arm64 to GHCR and creates a GitHub release
#
# It also builds every downloadable artifact: the plain binaries, the bundled
# ones carrying gallery-dl, the Flatpak and the Windows installer. 

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.27.0'
  GO_SHA256_LINUX_AMD64: 675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685
  GDL_VERSION: '1.32.10'
  GDL_SHA256_LINUX_AMD64: ac077cbff1b048916d61d7bcd8f43cf56b1e6a6b0698bd5c55bb436649e5748d
  GDL_SHA256_WINDOWS_AMD64: 1e4febe66444cf87e0b6d1de6fdf3004522f5d91a9c15b720db43ec34a1b73c9

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ steps.img.outputs.NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test ${{ matrix.arch }}
        run: |
          docker run --rm --entrypoint /usr/local/bin/monloader \
            ghcr.io/${{ steps.img.outputs.NAME }}@${{ steps.build.outputs.digest }} \
            -version

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.img.outputs.NAME }}:latest \
            --tag ghcr.io/${{ steps.img.outputs.NAME }}:${{ github.ref_name }} \
            $(printf 'ghcr.io/${{ steps.img.outputs.NAME }}@sha256:%s ' *)

      - name: Login to GHCR (legacy namespace)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: leqwin
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: Push to legacy namespace
        continue-on-error: true
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/leqwin/monloader:latest \
            --tag ghcr.io/leqwin/monloader:${{ github.ref_name }} \
            ghcr.io/${{ steps.img.outputs.NAME }}:${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract changelog entry
        run: |
          awk '/^## /{if(found){exit} found=1; next} found' CHANGELOG.md > .latest_changelog.md
          if [ ! -s .latest_changelog.md ]; then
            echo "No changelog entry found under a '## ' heading." >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: .latest_changelog.md

  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        run: ./packaging/install-go.sh

      - name: Fetch the bundled gallery-dl
        run: ./packaging/fetch-tools.sh

      - name: Build
        run: ./packaging/build-binaries.sh

      - name: Build the AppImage
        run: ./packaging/build-appimage.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: binaries-plain
          path: dist/*
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip
          ./packaging/install-go.sh

      - name: Fetch the bundled gallery-dl
        run: ./packaging/fetch-tools.sh

      - name: Build
        run: ./packaging/build-binaries.sh

      - name: Build the installers
        run: |
          ./packaging/build-installer.sh lite
          ./packaging/build-installer.sh bundled

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: binaries-windows-installer
          path: dist/monloader_*_setup.exe
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

      - name: Let bwrap open a user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0


      - name: Build the bundle
        run: ./packaging/flatpak-bundle.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: binaries-flatpak
          path: dist/*
          if-no-files-found: error

  aur:
    name: AUR package files
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the PKGBUILD and .SRCINFO
        run: ./packaging/build-aur.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/aur
          if-no-files-found: error

  attach:
    name: Attach the artifacts to the release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release, binaries, windows-installer, flatpak]
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Checksum every artifact
        working-directory: dist
        run: sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .

      - name: Attach
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
