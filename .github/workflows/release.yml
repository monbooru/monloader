name: Release

# Builds the Docker image for amd64 and arm64 to GHCR and creates a GitHub release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ steps.img.outputs.NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test ${{ matrix.arch }}
        run: |
          docker run --rm --entrypoint /usr/local/bin/monloader \
            ghcr.io/${{ steps.img.outputs.NAME }}@${{ steps.build.outputs.digest }} \
            -version

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.img.outputs.NAME }}:latest \
            --tag ghcr.io/${{ steps.img.outputs.NAME }}:${{ github.ref_name }} \
            $(printf 'ghcr.io/${{ steps.img.outputs.NAME }}@sha256:%s ' *)

      - name: Login to GHCR (legacy namespace)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: leqwin
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: Push to legacy namespace
        continue-on-error: true
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/leqwin/monloader:latest \
            --tag ghcr.io/leqwin/monloader:${{ github.ref_name }} \
            ghcr.io/${{ steps.img.outputs.NAME }}:${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog entry
        run: |
          awk '/^## /{if(found){exit} found=1; next} found' CHANGELOG.md > .latest_changelog.md
          if [ ! -s .latest_changelog.md ]; then
            echo "No changelog entry found under a '## ' heading." >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: .latest_changelog.md
