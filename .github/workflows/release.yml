name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.27.3'
  GO_SHA256_LINUX_AMD64: '65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40'
  GDL_VERSION: '1.32.19'
  GDL_SHA256_LINUX_AMD64: '9662483cafa72f51ce4b2153aebd620256a9ab536218674b8794f7b3ece11c29'
  GDL_SHA256_WINDOWS_AMD64: '4dda3f14efbc8a8e616af1fc7e1e88d795995326b47692453e620117254dec18'
  GDL_LICENSE_SHA256: '8177f97513213526df2cf6184d8ff986c675afb514d4e68a404010521b880643'

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ steps.img.outputs.NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test ${{ matrix.arch }}
        run: |
          docker run --rm --entrypoint /usr/local/bin/monloader \
            ghcr.io/${{ steps.img.outputs.NAME }}@${{ steps.build.outputs.digest }} \
            -version

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the manifest
        working-directory: /tmp/digests
        run: |
          latest=""
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            latest="--tag ghcr.io/${{ steps.img.outputs.NAME }}:latest"
          fi
          docker buildx imagetools create $latest \
            --tag ghcr.io/${{ steps.img.outputs.NAME }}:${{ github.ref_name }} \
            $(printf 'ghcr.io/${{ steps.img.outputs.NAME }}@sha256:%s ' *)

      - name: Login to GHCR (legacy namespace)
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: leqwin
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: Push to legacy namespace
        continue-on-error: true
        run: |
          latest=""
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            latest="--tag ghcr.io/leqwin/monloader:latest"
          fi
          docker buildx imagetools create $latest \
            --tag ghcr.io/leqwin/monloader:${{ github.ref_name }} \
            ghcr.io/${{ steps.img.outputs.NAME }}:${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: manifest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog entry
        run: |
          awk '/^## /{if(found){exit} found=1; next} found' CHANGELOG.md > .latest_changelog.md
          if [ ! -s .latest_changelog.md ]; then
            echo "No changelog entry found under a '## ' heading." >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: .latest_changelog.md

  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip
          ./packaging/install-go.sh "${GO_VERSION}" "${GO_SHA256_LINUX_AMD64}"

      - name: Fetch the bundled gallery-dl
        run: ./packaging/fetch-tools.sh

      - name: Build
        run: ./packaging/build-binaries.sh

      - name: Build the installers
        run: |
          ./packaging/build-installer.sh lite
          ./packaging/build-installer.sh bundled

      - name: Build the AppImage
        run: ./packaging/build-appimage.sh

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-plain
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

      - name: Let bwrap open a user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0


      - name: Build the bundle
        run: ./packaging/flatpak-bundle.sh

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-flatpak
          path: dist/*
          if-no-files-found: error

  aur:
    name: AUR package files
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the PKGBUILD and .SRCINFO
        run: ./packaging/build-aur.sh

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur
          path: dist/aur
          if-no-files-found: error

  attach:
    name: Attach the artifacts to the release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release, binaries, flatpak]
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Checksum every artifact
        working-directory: dist
        run: sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .

      - name: Attach
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
