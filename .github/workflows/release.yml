name: Release

concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  checks: read

jobs:
  check:
    name: The version is ready
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: On dev
        run: |
          if [ "${{ github.ref }}" != refs/heads/dev ]; then
            echo "::error::Release runs on dev, not on ${{ github.ref_name }}."
            exit 1
          fi

      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION.md)"
          if ! echo "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION.md must be strict SemVer 'vMAJOR.MINOR.PATCH', got: $version"
            exit 1
          fi
          heading="$(awk '/^## /{print $2; exit}' CHANGELOG.md)"
          if [ "$heading" != "[$version]" ]; then
            echo "::error::CHANGELOG.md's newest entry is $heading, VERSION.md says $version."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          g() { git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          remote_tag="$(g ls-remote --tags origin "refs/tags/$version")"
          if [ -n "$remote_tag" ]; then
            rm -rf /tmp/snap
            mkdir -p /tmp/snap
            rsync -a --exclude='.git/' --exclude='dist/' --exclude-from=.github/release-exclude ./ /tmp/snap/
            tree="$(cd /tmp/snap && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=/tmp/snap add -A && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" write-tree)"
            g fetch -q --depth 1 origin "refs/tags/$version"
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$tree" ]; then
              echo "::error::$version is already a tag; bump VERSION.md and CHANGELOG.md first."
              exit 1
            fi
            echo "::notice::$version is already tagged on this commit's snapshot: resuming its publication."
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Verify is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=verify&filter=all&per_page=100" --jq '.check_runs | max_by(.id) | if . == null then "" else (.conclusion // .status) end')"
          if [ -z "$newest" ]; then
            echo "::error::Verify has not run on $GITHUB_SHA; wait for it, or run it by hand first."
            exit 1
          fi
          if [ "$newest" != success ]; then
            echo "::error::Verify's newest run on $GITHUB_SHA is not green: $newest"
            exit 1
          fi

  build:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    name: Publish ${{ needs.check.outputs.version }}
    runs-on: ubuntu-latest
    needs: [check, build]
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download every artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Download the image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: /tmp/digests
          pattern: digests-*

      - name: Checksum every artifact
        working-directory: dist
        run: sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .

      - name: Extract the changelog entry
        run: |
          awk '/^## /{if(found){exit} found=1; next} found' CHANGELOG.md > /tmp/latest_changelog.md
          if [ ! -s /tmp/latest_changelog.md ]; then
            echo "::error::CHANGELOG.md has no entry under a '## ' heading."
            exit 1
          fi

      - name: Write the snapshot on main and the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name leqwin
          git config user.email 216300216+leqwin@users.noreply.github.com
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          g() { git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          rm -rf /tmp/snap
          mkdir -p /tmp/snap
          rsync -a --exclude='.git/' --exclude='dist/' --exclude-from=.github/release-exclude ./ /tmp/snap/
          tree="$(cd /tmp/snap && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=/tmp/snap add -A && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" write-tree)"
          remote_tag="$(g ls-remote --tags origin "refs/tags/$VERSION")"
          if [ -n "$remote_tag" ]; then
            g fetch -q origin "refs/tags/$VERSION"
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$tree" ]; then
              echo "::error::$VERSION is already a tag on another tree; nothing pushed."
              exit 1
            fi
            echo "main and $VERSION already hold this snapshot at $(git rev-parse 'FETCH_HEAD^{commit}')"
            exit 0
          fi
          parent=()
          commit=""
          if g fetch -q origin main 2>/dev/null; then
            tip="$(git rev-parse FETCH_HEAD)"
            parent=(-p "$tip")
            if [ "$(git rev-parse "$tip^{tree}")" = "$tree" ] && [ "$(git log -1 --format=%s "$tip")" = "release: $VERSION" ]; then
              commit="$tip"
              echo "main already holds this snapshot at $commit"
            fi
          fi
          if [ -z "$commit" ]; then
            commit="$(git commit-tree "$tree" "${parent[@]}" -m "release: $VERSION" -m "$(cat /tmp/latest_changelog.md)")"
            g push origin "$commit:refs/heads/main"
          fi
          g push origin "$commit:refs/tags/$VERSION"
          echo "main and $VERSION at $commit"

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          body_path: /tmp/latest_changelog.md
          files: dist/*
          overwrite_files: true

      - name: Build the PKGBUILD and .SRCINFO
        env:
          TARBALL_REPO: ${{ github.server_url }}/${{ github.repository }}
          TARBALL_TOKEN: ${{ github.token }}
        run: ./packaging/build-aur.sh

      - name: Upload the AUR files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aur
          path: dist/aur
          if-no-files-found: error
          overwrite: true

      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the images and move latest
        working-directory: /tmp/digests
        env:
          NAME: ${{ steps.img.outputs.NAME }}
        run: |
          refs=()
          for f in digests-*/*; do
            refs+=("ghcr.io/$NAME@sha256:${f##*/}")
          done
          docker buildx imagetools create \
            --tag "ghcr.io/$NAME:${VERSION}" \
            --tag "ghcr.io/$NAME:latest" \
            "${refs[@]}"

      - name: Login to GHCR (legacy namespace)
        id: legacy
        if: github.repository == 'monbooru/monloader'
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: leqwin
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: The legacy namespace login failed
        if: steps.legacy.outcome == 'failure'
        run: echo "::warning::The login to the legacy namespace failed (GHCR_LEGACY_TOKEN expired?); ghcr.io/leqwin/monloader keeps its old tags."

      - name: Tag the images and move latest in the legacy namespace
        if: steps.legacy.outcome == 'success'
        env:
          NAME: ${{ steps.img.outputs.NAME }}
        run: |
          for suffix in ""; do
            docker buildx imagetools create \
              --tag "ghcr.io/leqwin/monloader:${VERSION}$suffix" \
              --tag "ghcr.io/leqwin/monloader:latest$suffix" \
              "ghcr.io/$NAME:${VERSION}$suffix" \
              || echo "::warning::The push of ${VERSION}$suffix to the legacy namespace failed; ghcr.io/leqwin/monloader keeps its old tags."
          done
