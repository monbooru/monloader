name: Release

concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  checks: read

jobs:
  check:
    name: The version is ready
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: On dev
        run: |
          if [ "${{ github.ref }}" != refs/heads/dev ]; then
            echo "::error::Release runs on dev, not on ${{ github.ref_name }}."
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION.md)"
          if ! echo "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION.md must be strict SemVer 'vMAJOR.MINOR.PATCH', got: $version"
            exit 1
          fi
          heading="$(awk '/^## /{print $2; exit}' CHANGELOG.md)"
          if [ "$heading" != "[$version]" ]; then
            echo "::error::CHANGELOG.md's newest entry is $heading, VERSION.md says $version."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$version" | grep -q "refs/tags/$version"; then
            echo "::error::$version is already a tag; bump VERSION.md and CHANGELOG.md first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Verify is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusions="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=verify&per_page=50" --jq '.check_runs[].conclusion')"
          if [ -z "$conclusions" ]; then
            echo "::error::Verify has not run on ${{ github.sha }}; wait for it, or run it by hand first."
            exit 1
          fi
          if ! echo "$conclusions" | grep -qx success; then
            echo "::error::Verify is not green on ${{ github.sha }}: $(echo "$conclusions" | tr '\n' ' ')"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      image_tags: ${{ needs.check.outputs.version }}
    secrets: inherit

  publish:
    name: Publish ${{ needs.check.outputs.version }}
    runs-on: ubuntu-latest
    needs: [check, build]
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download every artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Checksum every artifact
        working-directory: dist
        run: sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .

      - name: Extract the changelog entry
        run: |
          awk '/^## /{if(found){exit} found=1; next} found' CHANGELOG.md > /tmp/latest_changelog.md
          if [ ! -s /tmp/latest_changelog.md ]; then
            echo "::error::CHANGELOG.md has no entry under a '## ' heading."
            exit 1
          fi

      - name: Write the snapshot on main and the tag
        run: |
          git config user.name leqwin
          git config user.email 216300216+leqwin@users.noreply.github.com
          rm -rf /tmp/snap
          mkdir -p /tmp/snap
          rsync -a --exclude='.git/' --exclude='dist/' --exclude-from=.github/release-exclude ./ /tmp/snap/
          tree="$(cd /tmp/snap && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=/tmp/snap add -A && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" write-tree)"
          parent=""
          if git fetch -q origin main 2>/dev/null; then
            parent="-p $(git rev-parse FETCH_HEAD)"
          fi
          commit="$(git commit-tree $tree $parent -m "release: $VERSION" -m "$(cat /tmp/latest_changelog.md)")"
          git push origin "$commit:refs/heads/main"
          git push origin "$commit:refs/tags/$VERSION"
          echo "main and $VERSION at $commit"

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          body_path: /tmp/latest_changelog.md
          files: dist/*

      - name: Build the PKGBUILD and .SRCINFO
        env:
          TARBALL_REPO: ${{ github.server_url }}/${{ github.repository }}
          TARBALL_TOKEN: ${{ github.token }}
        run: ./packaging/build-aur.sh

      - name: Upload the AUR files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aur
          path: dist/aur
          if-no-files-found: error

      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest
        run: |
          for suffix in ""; do
            docker buildx imagetools create \
              --tag "ghcr.io/${{ steps.img.outputs.NAME }}:latest$suffix" \
              "ghcr.io/${{ steps.img.outputs.NAME }}:${VERSION}$suffix"
          done

      - name: Login to GHCR (legacy namespace)
        if: github.repository == 'monbooru/monloader'
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: leqwin
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: Move latest in the legacy namespace
        if: github.repository == 'monbooru/monloader'
        continue-on-error: true
        run: |
          for suffix in ""; do
            docker buildx imagetools create \
              --tag "ghcr.io/leqwin/monloader:latest$suffix" \
              "ghcr.io/${{ steps.img.outputs.NAME }}:${VERSION}$suffix"
          done
