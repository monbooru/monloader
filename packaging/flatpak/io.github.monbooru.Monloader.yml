app-id: io.github.monbooru.Monloader
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: monloader-run

finish-args:
  - --share=network
  - --filesystem=xdg-config/autostart:create

modules:
  - name: gallery-dl
    buildsystem: simple
    build-commands:
      - install -Dm755 gallery-dl.bin /app/bin/gallery-dl
      - install -Dm644 LICENSE.gallery-dl /app/share/licenses/gallery-dl/LICENSE
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://codeberg.org/mikf/gallery-dl/releases/download/v1.32.19/gallery-dl.bin
        sha256: 9662483cafa72f51ce4b2153aebd620256a9ab536218674b8794f7b3ece11c29
      - type: file
        dest-filename: LICENSE.gallery-dl
        url: https://codeberg.org/mikf/gallery-dl/raw/tag/v1.32.19/LICENSE
        sha256: 8177f97513213526df2cf6184d8ff986c675afb514d4e68a404010521b880643

  - name: monloader
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      build-args:
        - --share=network
    build-commands:
      - |
        set -eu
        export GOTOOLCHAIN=go$(awk '/^go /{print $2; exit}' go.mod)
        . ./packaging/release-env.sh
        CGO_ENABLED=0 go build \
          -ldflags="-s -w $LDFLAGS -X '$MOD.Package=flatpak'" \
          -o monloader ./cmd/monloader
        sh packaging/metainfo.sh io.github.monbooru.Monloader.desktop > metainfo.xml
      - install -Dm755 monloader /app/bin/monloader
      - install -Dm755 packaging/flatpak/monloader-run /app/bin/monloader-run
      - install -Dm644 packaging/flatpak/io.github.monbooru.Monloader.desktop /app/share/applications/io.github.monbooru.Monloader.desktop
      - install -Dm644 metainfo.xml /app/share/metainfo/io.github.monbooru.Monloader.metainfo.xml
      - install -Dm644 packaging/icons/monloader-64.png /app/share/icons/hicolor/64x64/apps/io.github.monbooru.Monloader.png
      - install -Dm644 packaging/icons/monloader-128.png /app/share/icons/hicolor/128x128/apps/io.github.monbooru.Monloader.png
      - install -Dm644 packaging/icons/monloader-256.png /app/share/icons/hicolor/256x256/apps/io.github.monbooru.Monloader.png
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - monloader
          - dist
          - stage
          - tools
          - test-results
