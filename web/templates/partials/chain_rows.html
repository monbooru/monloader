{{define "chain_rows"}}{{range .}}<li draggable="true" data-name="{{.Name}}"><span>{{.Name}}{{if .Similarity}} <span class="field-hint">(similarity)</span>{{end}}</span><span class="chain-moves"><button type="button" class="btn-link-accent chain-move" data-move="chain-on" aria-label="Query {{.Name}}">[+]</button><button type="button" class="btn-link-accent chain-move" data-move="up" aria-label="Move {{.Name}} earlier">[^]</button><button type="button" class="btn-link-accent chain-move" data-move="down" aria-label="Move {{.Name}} later">[v]</button><button type="button" class="btn-link-accent chain-move" data-move="chain-off" aria-label="Stop querying {{.Name}}">[x]</button></span></li>
{{end}}{{end}}
