{{define "chain_rows"}}{{range .}}<li data-name="{{.Name}}"><button type="button" class="reorder-grip" aria-label="Move {{.Name}}" title="Drag to reorder, or press &uarr; / &darr;">&equiv;</button><span>{{.Name}}{{if .Similarity}} <span class="field-hint">(similarity)</span>{{end}}</span><span class="chain-moves"><button type="button" class="btn-link-accent chain-move" data-move="chain-on" aria-label="Query {{.Name}}">[+]</button><button type="button" class="btn-link-accent chain-move" data-move="chain-off" aria-label="Stop querying {{.Name}}">[x]</button></span></li>
{{end}}{{end}}
