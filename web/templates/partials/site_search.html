{{define "site_search"}}
<div class="table-scroll">
<table class="grid-table sites-table search-table">
  {{if .Rows}}
  <thead><tr><th>Site</th><th>Name</th><th>Profile</th><th>Login</th><th>Action</th></tr></thead>
  <tbody>
  {{range .Rows}}
  <tr>
    <td>{{.Category}}</td>
    <td class="field-hint">{{.Name}}</td>
    <td><span class="status-badge">{{.Family}}</span></td>
    <td><span class="status-badge">{{.Login}}</span></td>
    <td>{{if .Configured}}<button type="button" disabled title="Already configured - use its row's edit button">Add</button>{{else}}<button type="button" class="edit-site" data-site="{{.Category}}" title="Set up this site - nothing is stored until you save">Add</button>{{end}}</td>
  </tr>
  {{end}}
  {{if gt .More 0}}<tr><td colspan="5" class="field-hint">+{{.More}} more - refine the search</td></tr>{{end}}
  </tbody>
  {{else}}
  <tbody><tr><td class="field-hint">No supported site matches.</td></tr></tbody>
  {{end}}
</table>
</div>
{{end}}
