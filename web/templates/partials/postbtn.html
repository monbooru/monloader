{{define "postbtn"}}<form method="POST" action="{{.Action}}"{{if .Inline}} style="display:inline"{{end}}{{with .Confirm}} hx-confirm="{{.}}" data-confirm-ok="{{$.ConfirmOK}}" data-confirm-danger="{{$.ConfirmDanger}}"{{end}}>
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <button type="submit"{{if .Title}} title="{{.Title}}"{{end}}{{if .Disabled}} disabled{{end}}>{{.Label}}</button>
</form>{{end}}
