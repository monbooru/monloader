{{define "pause_toggle"}}<span id="pause-toggle" class="pause-toggle" hx-get="/internal/queue-pause" hx-trigger="every 5s" hx-target="#pause-toggle" hx-swap="outerHTML">
  <form hx-post="/queue/{{if .Paused}}resume{{else}}pause{{end}}" hx-target="#pause-toggle" hx-swap="outerHTML">
    <button type="submit" class="topbar-action pause-btn{{if .Paused}} paused{{end}}" aria-label="{{if .Paused}}Resume downloads{{else}}Pause downloads{{end}}" title="{{if .Paused}}Downloads paused - click to resume{{else}}Pause new downloads{{end}}">{{if .Paused}}[&#x25B6;&#xFE0E; resume]{{else}}[&#x23F8;&#xFE0E; pause]{{end}}</button>
  </form>
</span>{{end}}
