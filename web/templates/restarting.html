{{define "restarting"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="60;url=/">
  <title>{{.BooruName}} is restarting</title>
  <link rel="stylesheet" href="/static/main.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>{{.BooruName}} is restarting</h1>
      <p class="field-hint">This page will reload automatically.</p>
      {{if .InFlight}}
      <p class="field-hint">{{.InFlight}} job(s) were running or waiting. The restart cancelled them; retry them from the queue once it is back.</p>
      {{end}}
    </div>
  </div>
  <script>
    // Poll rather than wait a fixed time: one refusal proves the old
    // process gone, and past 2s any answer counts, as a quick restart can
    // leave no gap to see. The meta refresh is the no-script fallback.
    (function () {
      var down = false, tries = 0;
      var probe = function () {
        if (tries++ > 240) { return; }
        var settled = down || tries > 8;
        fetch("/health", { cache: "no-store" })
          .then(function (r) {
            if (r.ok && settled) { location.replace("/"); } else { setTimeout(probe, 250); }
          })
          .catch(function () { down = true; setTimeout(probe, 250); });
      };
      setTimeout(probe, 250);
    })();
  </script>
</body>
</html>
{{end}}
