{{define "notfound"}}{{template "doc_head" .}}
{{template "topbar" .}}
<main id="content">
  <div id="notfound-page" class="mascot-page">
    {{with .Mascot.lost}}<img src="{{.}}" alt="" class="mascot">{{end}}
    <div class="mascot-page-text">
      <h2 class="mascot-page-code">404</h2>
      <p class="mascot-page-title">Nothing here. (￣～￣;)</p>
      <p class="field-hint">That page does not exist.</p>
      <div class="mascot-page-actions"><a href="/">← Back to monloader</a><span class="field-hint">or press <kbd>g</kbd> <kbd>q</kbd> for the queue</span></div>
    </div>
  </div>
</main>
{{template "footer" .}}
{{template "doc_foot" .}}{{end}}
